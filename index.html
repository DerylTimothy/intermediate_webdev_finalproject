<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simple Interest and Total Payable Amount Calculator">
    <meta name="keywords" content="Simple Interest, Calculator, Finance, Interest Rate">
    <title>Simple Interest Calculator</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Simple Interest Calculator</h1>
        <form id="interest-form">
            <label for="principal">Principal Amount:</label>
            <input type="number" id="principal" placeholder="Enter principal amount" required>
            
            <label for="rate">Rate of Interest (%):</label>
            <input type="number" id="rate" placeholder="Enter interest rate" required>
            
            <label for="time">Time (Years):</label>
            <input type="number" id="time" placeholder="Enter time in years" required>
            
            <button type="button" id="calculate-btn" onclick="calculate()">Calculate</button>
        </form>
        <div id="result"></div>
    </div>
</body>
</html>
